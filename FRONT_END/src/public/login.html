<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Aegis & Anarchy</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Space Mono', monospace;
            background: #0a0a1a;
            color: #e0e0ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 0, 255, 0.08) 0%, transparent 60%);
        }
        
        .container { width: 100%; max-width: 450px; }
        
        .logo { text-align: center; margin-bottom: 30px; }
        
        .logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00f0ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        
        .logo p { font-size: 0.7rem; color: #8888cc; letter-spacing: 4px; }
        
        .card {
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.1);
        }
        
        .card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: #00f0ff;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        
        .form-group { margin-bottom: 20px; }
        
        .form-group label {
            display: block;
            font-size: 0.7rem;
            color: #8888cc;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 8px;
            color: #e0e0ff;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #00f0ff, #ff00ff);
            color: #0a0a1a;
        }
        
        .btn-primary:hover {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }
        
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #8888cc;
        }
        
        .link a {
            color: #00f0ff;
            text-decoration: none;
            font-weight: 700;
        }
        
        .link a:hover { text-decoration: underline; }
        
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            display: none;
        }
        
        .alert.show { display: block; }
        .alert.error { background: rgba(255, 0, 68, 0.1); border: 1px solid #ff0044; color: #ff0044; }
        .alert.success { background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; color: #00ff88; }
        
        .demo-accounts {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-size: 0.7rem;
        }
        
        .demo-accounts h3 {
            color: #ffaa00;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        
        .demo-account {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            color: #8888cc;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .demo-account:hover { color: #00f0ff; }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #8888cc;
            font-size: 0.75rem;
            position: relative;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(0, 240, 255, 0.2);
        }
        
        .divider::before { left: 0; }
        .divider::after { right: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>⚡Vantablack </h1>
            <p>TACTICAL ACCESS PORTAL</p>
        </div>

        <div class="card">
            <h2>🔐 SYSTEM LOGIN</h2>
            
            <div id="alert" class="alert"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username" required autocomplete="username" />
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password" />
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">⚡ LOGIN</button>
            </form>
            
            <div class="divider">DEMO ACCOUNTS</div>
            
            <div class="demo-accounts">
                <h3>🧪 Click to Auto-Fill</h3>
                <div class="demo-account" onclick="fillDemo('juan', 'password123')">
                    <span>👤 Civilian</span><span>juan / password123</span>
                </div>
                <div class="demo-account" onclick="fillDemo('vantablack', 'password123')">
                    <span>🦸 Hero</span><span>vantablack / password123</span>
                </div>
                <div class="demo-account" onclick="fillDemo('shadow', 'password123')">
                    <span>🦹 Villain</span><span>shadow / password123</span>
                </div>
                <div class="demo-account" onclick="fillDemo('admin', 'password123')">
                    <span>👑 Admin</span><span>admin / password123</span>
                </div>
            </div>
            
            <div class="link">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8080/api';
        
        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('aegis_token');
            if (token) {
                window.location.href = 'index.html';
            }
        });
        
        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert ${type} show`;
            alert.textContent = message;
        }
        
        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '⏳ LOGGING IN...';
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('aegis_token', data.data.token);
                    localStorage.setItem('aegis_user', JSON.stringify(data.data.user));
                    
                    showAlert('success', `✅ Welcome ${data.data.user.name}! Redirecting...`);
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 800);
                } else {
                    showAlert('error', '❌ ' + data.message);
                    btn.disabled = false;
                    btn.textContent = '⚡ LOGIN';
                }
            } catch (error) {
                showAlert('error', '❌ Cannot connect to server. Make sure backend is running.');
                btn.disabled = false;
                btn.textContent = '⚡ LOGIN';
            }
        }
    </script>
</body>
</html>
